<script>
(function () {
  var S = window.Sitio;
  var cont = document.getElementById('textos');
  S.T.forEach(function (p) {
    var sec = document.createElement('article');
    sec.className = 'texto-obra';
    sec.id = p.slug;
    var cab = document.createElement('header');
    cab.innerHTML = '<h1></h1><p class="gris datos"></p>';
    cab.querySelector('h1').textContent = p.titulo;
    cab.querySelector('.datos').textContent = [p.anio, p.tecnica, p.donde ? 'Encontrado en: ' + p.donde : ''].filter(Boolean).join(' · ');
    sec.appendChild(cab);
    if (p.pdf) {
      var d = document.createElement('a');
      d.className = 'descarga';
      d.href = p.pdf;
      d.setAttribute('download', '');
      d.textContent = 'descargar pdf';
      cab.appendChild(d);
    }
    if (p.estrofas) {
      /* el texto como texto, sin imágenes */
      var cuerpo = document.createElement('div');
      cuerpo.className = 'poema';
      p.estrofas.forEach(function (est) {
        var e = document.createElement('div');
        e.className = 'estrofa';
        est.forEach(function (linea) {
          var l = document.createElement('p');
          l.textContent = linea;
          e.appendChild(l);
        });
        cuerpo.appendChild(e);
      });
      sec.appendChild(cuerpo);
    } else {
      var paginas = document.createElement('div');
      paginas.className = 'paginas';
      p.imagenes.forEach(function (src, k) { paginas.appendChild(S.imagen(src, p.titulo + ', página ' + (k + 1), k > 0)); });
      sec.appendChild(paginas);
    }
    cont.appendChild(sec);
  });
})();
</script>
