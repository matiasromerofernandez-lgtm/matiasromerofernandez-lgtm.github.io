<script src="data.js?v=22"></script>
<script src="sitio.js?v=16"></script>
<script>
(function () {
  var S = window.Sitio;
  var lista = document.getElementById('lista');
  function fila(p, i) {
    var a = document.createElement('a');
    a.className = 'fila';
    a.href = S.enlace(p);
    a.innerHTML = '<span class="num"></span><span class="t"></span><span class="gris donde"></span><span class="gris a"></span>';
    a.querySelector('.num').textContent = String(i + 1).padStart(2, '0');
    a.querySelector('.t').textContent = p.titulo;
    a.querySelector('.donde').textContent = p.donde || '—';
    a.querySelector('.a').textContent = p.anio || '—';
    lista.appendChild(a);
  }
  S.P.forEach(fila);
  /* la canción del tiempo va al final, sin subtítulo, siguiendo la numeración */
  S.T.forEach(function (p, k) { fila(p, S.P.length + k); });
})();
</script>
